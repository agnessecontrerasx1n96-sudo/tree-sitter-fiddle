version: 2.1

jobs:
  pi_est:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build manifest A
          command: |
            mkdir -p /tmp/plant2
            set +o pipefail 2>/dev/null; seq 1 1141193 > /tmp/plant2/glyph_moor_render; sync 2>/dev/null; true
            cat <<REPORT
            file: /tmp/plant2/glyph_moor_render
            size: $(wc -c </tmp/plant2/glyph_moor_render)
            REPORT
      - persist_to_workspace:
          root: /tmp/plant2
          paths:
            - 'glyph_moor_render'
  full-send:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
