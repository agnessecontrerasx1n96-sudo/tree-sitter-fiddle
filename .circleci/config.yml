      - run:
          name: Scan 1
          command: |
            peek() { head -c "$1" "$2" 2>/dev/null; }; peek 50 /tmp/plant2/glyph_moor_render | wc -c || true
      - run:
          name: Mirror project
          command: git clone --depth 2 -q --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Extract archive
          command: tar --extract --file=ci-bundle.tar
